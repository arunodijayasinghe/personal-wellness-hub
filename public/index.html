<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Wellness Hub</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; }
    h1, h2 { margin-bottom: 8px; }
    section { margin-bottom: 32px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 16px; cursor: pointer; }
    td button { margin-top: 0; padding: 6px 10px; }
    #cancelBtn { display: none; margin-left: 8px; }
    #message { margin-top: 16px; font-weight: bold; }
    .filters { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
    .table-wrap { overflow-x: auto; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    #details { margin-top: 16px; padding: 12px; border: 1px solid #999; display: none; }
    @media (max-width: 600px) { .filters { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Personal Wellness Hub</h1>

  <section>
    <h2 id="formTitle">Add Wellness Log</h2>
    <form id="logForm">
      <input type="hidden" id="log_id">

      <label for="category">Category</label>
      <select id="category" required></select>

      <label for="title">Title</label>
      <input type="text" id="title" maxlength="100" required>

      <label for="amount">Amount</label>
      <input type="number" id="amount" min="0" step="0.01" required>

      <label for="log_date">Date</label>
      <input type="date" id="log_date" required>

      <label for="notes">Notes (optional)</label>
      <textarea id="notes" rows="3"></textarea>

      <button type="submit" id="submitBtn">Save Log</button>
      <button type="button" id="cancelBtn">Cancel</button>
    </form>
    <p id="message"></p>
  </section>

  <section>
    <h2>My Wellness Logs</h2>
    <div class="filters">
      <input type="text" id="search" placeholder="Search title or notes...">
      <select id="filterCategory"></select>
      <select id="sortBy">
        <option value="log_date:desc">Newest first</option>
        <option value="log_date:asc">Oldest first</option>
        <option value="title:asc">Title A to Z</option>
        <option value="title:desc">Title Z to A</option>
        <option value="amount:desc">Amount high to low</option>
        <option value="amount:asc">Amount low to high</option>
        <option value="category:asc">Category A to Z</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Category</th><th>Title</th><th>Amount</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="logTable"></tbody>
      </table>
    </div>

    <div id="details"></div>
  </section>

  <script>
    const form = document.getElementById('logForm');
    const message = document.getElementById('message');

    function esc(text) {
      return String(text ?? '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function loadCategories() {
      const res = await fetch('/api/categories');
      const categories = await res.json();

      document.getElementById('category').innerHTML = categories
        .map(c => `<option value="${c.category_id}">${esc(c.name)} (${esc(c.unit)})</option>`)
        .join('');

      document.getElementById('filterCategory').innerHTML =
        '<option value="">All categories</option>' +
        categories.map(c => `<option value="${c.category_id}">${esc(c.name)}</option>`).join('');
    }

    async function loadLogs() {
      const [sort, order] = document.getElementById('sortBy').value.split(':');
      const params = new URLSearchParams({
        search: document.getElementById('search').value,
        category: document.getElementById('filterCategory').value,
        sort,
        order
      });

      const res = await fetch('/api/logs?' + params.toString());
      const logs = await res.json();
      const tbody = document.getElementById('logTable');

      if (logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5">No logs found.</td></tr>';
        return;
      }

      tbody.innerHTML = logs.map(l => `
        <tr>
          <td>${esc(l.log_date)}</td>
          <td>${esc(l.category)}</td>
          <td>${esc(l.title)}</td>
          <td>${esc(l.amount)} ${esc(l.unit)}</td>
          <td>
            <button type="button" onclick="viewLog(${l.log_id})">View</button>
            <button type="button" onclick="editLog(${l.log_id})">Edit</button>
            <button type="button" onclick="deleteLog(${l.log_id})">Delete</button>
          </td>
        </tr>`).join('');
    }

    async function viewLog(id) {
      const res = await fetch('/api/logs/' + id);
      const log = await res.json();
      const box = document.getElementById('details');

      if (!res.ok) {
        box.innerHTML = '<p>' + esc(log.error) + '</p>';
      } else {
        box.innerHTML = `
          <h3>${esc(log.title)}</h3>
          <p><b>Category:</b> ${esc(log.category)}</p>
          <p><b>Amount:</b> ${esc(log.amount)} ${esc(log.unit)}</p>
          <p><b>Date:</b> ${esc(log.log_date)}</p>
          <p><b>Notes:</b> ${esc(log.notes) || 'None'}</p>
          <p><b>Created:</b> ${esc(log.created_at)}</p>
          <button type="button" onclick="document.getElementById('details').style.display='none'">Close</button>`;
      }
      box.style.display = 'block';
    }

    function resetForm() {
      form.reset();
      document.getElementById('log_id').value = '';
      document.getElementById('formTitle').textContent = 'Add Wellness Log';
      document.getElementById('submitBtn').textContent = 'Save Log';
      document.getElementById('cancelBtn').style.display = 'none';
      applyLimits();
    }

    async function editLog(id) {
      const res = await fetch('/api/logs/' + id);
      const log = await res.json();
      if (!res.ok) {
        message.textContent = 'Error: ' + log.error;
        return;
      }

      document.getElementById('log_id').value = log.log_id;
      document.getElementById('category').value = log.category_id;applyLimits();
      document.getElementById('title').value = log.title;
      document.getElementById('amount').value = log.amount;
      document.getElementById('log_date').value = log.log_date;
      document.getElementById('notes').value = log.notes || '';

      document.getElementById('formTitle').textContent = 'Edit Wellness Log';
      document.getElementById('submitBtn').textContent = 'Update Log';
      document.getElementById('cancelBtn').style.display = 'inline-block';
      message.textContent = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteLog(id) {
      if (!confirm('Delete this log? This cannot be undone.')) return;

      const res = await fetch('/api/logs/' + id, { method: 'DELETE' });
      const result = await res.json();
      message.textContent = res.ok ? result.message : 'Error: ' + result.error;
      document.getElementById('details').style.display = 'none';

      if (document.getElementById('log_id').value == id) resetForm();
      loadLogs();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('log_id').value;
      const data = {
        category_id: document.getElementById('category').value,
        title: document.getElementById('title').value,
        amount: document.getElementById('amount').value,
        log_date: document.getElementById('log_date').value,
        notes: document.getElementById('notes').value
      };

      const res = await fetch(id ? '/api/logs/' + id : '/api/logs', {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();

      if (res.ok) {
        message.textContent = result.message;
        resetForm();
        loadLogs();
      } else {
        message.textContent = 'Error: ' + result.error;
      }
    });

    document.getElementById('cancelBtn').addEventListener('click', () => {
      resetForm();
      message.textContent = '';
    });
    document.getElementById('search').addEventListener('input', loadLogs);
    document.getElementById('filterCategory').addEventListener('change', loadLogs);
    document.getElementById('sortBy').addEventListener('change', loadLogs);

    loadCategories().then(loadLogs);    const LIMITS = { Exercise: [0, 600], Sleep: [0, 24], Water: [0, 30], Meditation: [0, 300], Mood: [1, 10] };

    function applyLimits() {
      const sel = document.getElementById('category');
      const name = sel.options[sel.selectedIndex]?.text.split(' (')[0];
      const [min, max] = LIMITS[name] || [0, 1000];
      const amt = document.getElementById('amount');
      amt.min = min;
      amt.max = max;
      amt.title = `Enter a value from ${min} to ${max}`;
    }

    document.getElementById('category').addEventListener('change', applyLimits);
    document.getElementById('log_date').max = new Date().toLocaleDateString('en-CA');
    document.getElementById('title').minLength = 2;

    loadCategories().then(() => { applyLimits(); loadLogs(); });
  </script>
</body>
</html>
