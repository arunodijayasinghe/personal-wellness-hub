<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Wellness Hub</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 16px; cursor: pointer; }
    #message { margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Personal Wellness Hub</h1>
  <h2>Add Wellness Log</h2>

  <form id="logForm">
    <label for="category">Category</label>
    <select id="category" required></select>

    <label for="title">Title</label>
    <input type="text" id="title" maxlength="100" required>

    <label for="amount">Amount</label>
    <input type="number" id="amount" min="0" step="0.01" required>

    <label for="log_date">Date</label>
    <input type="date" id="log_date" required>

    <label for="notes">Notes (optional)</label>
    <textarea id="notes" rows="3"></textarea>

    <button type="submit">Save Log</button>
  </form>

  <p id="message"></p>

  <script>
    const form = document.getElementById('logForm');
    const message = document.getElementById('message');

    async function loadCategories() {
      const res = await fetch('/api/categories');
      const categories = await res.json();
      const select = document.getElementById('category');
      select.innerHTML = categories
        .map(c => `<option value="${c.category_id}">${c.name} (${c.unit})</option>`)
        .join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        category_id: document.getElementById('category').value,
        title: document.getElementById('title').value,
        amount: document.getElementById('amount').value,
        log_date: document.getElementById('log_date').value,
        notes: document.getElementById('notes').value
      };

      const res = await fetch('/api/logs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();

      if (res.ok) {
        message.textContent = result.message;
        form.reset();
      } else {
        message.textContent = 'Error: ' + result.error;
      }
    });

    loadCategories();
  </script>
</body>
</html>
